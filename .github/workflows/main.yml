name: Build OpenJarvis Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "OpenJarvis-main/android-app/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

            - name: Check project files
        run: |
          pwd
          ls -la
          find . -name settings.gradle.kts

      - name: Build debug APK
        run: |
          cd OpenJarvis-main/android-app
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-debug-APK
          path: OpenJarvis-main/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
