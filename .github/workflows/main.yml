name: Build OpenJarvis Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "OpenJarvis-main/OpenJarvis-main/android-app/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

env:
  APP_DIR: OpenJarvis-main/OpenJarvis-main/android-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept licenses and install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check project files
        run: |
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Android project folder not found: $APP_DIR"
            ls -la
            exit 1
          fi
          find "$APP_DIR" -maxdepth 4 -type f -not -path "*/.git/*" | sort

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-debug-APK
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
